<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HarnessMM 决策复用面板</title>
<style>
:root{
  --bg:#f7f8fa; --card:#ffffff; --border:#e8eaed; --border-soft:#f0f2f4;
  --text:#1f2328; --muted:#6e7781; --dim:#9aa4b2; --pill:#f4f5f7; --hover:#f8f9fb;
  --emerald:#10b981; --teal:#14b8a6; --blue:#3b82f6; --cyan:#06b6d4;
  --violet:#8b5cf6; --pink:#ec4899; --orange:#f97316; --amber:#f59e0b;
  --red:#ef4444; --slate:#94a3b8;
  --r:12px;
  --mono:'Cascadia Code','Consolas','SF Mono','DejaVu Sans Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:13px}
body{padding:16px 18px 60px}

/* 状态条 */
.statusbar{
  display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r);
  padding:11px 14px;margin-bottom:14px;border-left:3px solid var(--slate);
  transition:border-left-color .3s ease;
}
.statusbar[data-s="B"]{border-left-color:var(--amber)}
.statusbar[data-s="C"]{border-left-color:var(--emerald)}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--slate);flex:none;transition:background .3s}
.statusbar[data-s="B"] .sb-dot{background:var(--amber)}
.statusbar[data-s="C"] .sb-dot{background:var(--emerald);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.sb-title{font-size:13px;font-weight:650}
.sb-sub{font-size:12px;color:var(--muted);flex:1}
.sb-btn{
  font-family:inherit;font-size:11.5px;padding:5px 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  cursor:pointer;transition:all .15s;white-space:nowrap;
}
.sb-btn:hover{background:var(--hover);color:var(--text)}

/* 状态切换 */
.switcher{display:flex;gap:6px;margin-bottom:14px;align-items:center;font-size:11px;color:var(--dim)}
.sw{
  font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:7px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  cursor:pointer;transition:all .15s;
}
.sw:hover{background:var(--hover)}
.sw.on{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;font-weight:600}

/* 栅格 */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:14px;min-width:0}
.col-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}

/* 卡片 */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;min-width:0}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ch svg{width:15px;height:15px;flex:none;color:var(--muted)}
.ch h2{font-size:13px;font-weight:650;flex:1;min-width:80px}
.ch .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.ch .meta b{color:var(--muted);font-weight:600}

/* 药丸 */
.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.pill{background:var(--pill);border-radius:10px;padding:11px 15px;min-width:104px;transition:background .2s}
.pill .pv{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.pill .pl{font-size:11.5px;color:var(--muted);margin-top:3px}
.pill.hi .pv{color:var(--emerald)}
.pill.dim .pv{color:var(--dim)}
.pill.warn .pv{color:var(--amber)}

/* 分节 */
.sect{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.sect h3{font-size:12.5px;font-weight:600}
.sect .n{margin-left:auto;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--border-soft);margin:16px 0}

/* 图例 */
.legend{display:flex;flex-wrap:wrap;gap:6px 18px}
.li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.li .d{width:7px;height:7px;border-radius:2px;flex:none}
.li b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* 值得注意 */
.nb{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border-soft)}
.nb:last-child{border-bottom:0}
.nb .d{width:7px;height:7px;border-radius:2px;flex:none}
.nb .k{color:var(--muted);flex:1}
.nb .v{color:var(--text);font-weight:650;font-family:var(--mono);font-size:11.5px}
.nb .v em{font-style:normal;color:var(--dim);font-weight:400}

/* 条形图 */
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:132px 1fr 30px;gap:10px;align-items:center}
.bar-row .bn{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .bt{height:7px;background:var(--pill);border-radius:4px;overflow:hidden}
.bar-row .bf{height:100%;border-radius:4px;width:0;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar-row .bv{font-size:11.5px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.bar-row .bv.hot{color:var(--red);font-weight:600}

/* 环形图 */
.donut-wrap{display:flex;align-items:center;gap:20px}
.donut{position:relative;flex:none}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .ctr .big{font-size:19px;font-weight:700;letter-spacing:-.4px}
.donut .ctr .sm{font-size:10.5px;color:var(--dim);margin-top:1px}
.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
.dl{display:flex;align-items:center;gap:7px;font-size:12px}
.dl .d{width:7px;height:7px;border-radius:2px;flex:none}
.dl .nm{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl .pc{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

/* DAG */
.dag{position:relative;height:196px;margin:2px 0 4px}
.dag svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.dn{
  position:absolute;transform:translate(-50%,-50%);background:var(--card);
  border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:104px;
  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:all .18s;
}
.dn:hover{border-color:#c7d2fe;box-shadow:0 2px 8px rgba(16,24,40,.08)}
.dn .dk{font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}
.dn .dt{font-size:11.5px;font-weight:650;display:block}
.dn .do{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.dn[data-st="done"] .dk{color:var(--cyan)}
.dn[data-st="run"] .dk{color:var(--amber)}
.dn[data-st="hit"]{border-color:#a7f3d0;background:#f0fdf9}
.dn[data-st="hit"] .dk{color:var(--emerald)}

/* 证书行 */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);font-size:12px;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover);border-radius:6px}
.row .ck{color:var(--emerald);flex:none;font-size:11px}
.row .cid{font-family:var(--mono);font-size:11px;font-weight:700;flex:none;min-width:16px}
.row .ct{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .cg{
  font-size:10.5px;padding:2px 7px;border-radius:5px;flex:none;
  background:#fffbeb;border:1px solid #fde68a;color:#92400e;
  font-family:var(--mono);white-space:nowrap;
}
.row .chv{color:var(--dim);font-size:10px;flex:none;transition:transform .2s ease}
.row.open .chv{transform:rotate(90deg)}

/* ============ 证书展开 ============ */
.cert-block{border-bottom:1px solid var(--border-soft)}
.cert-block:last-child{border-bottom:0}
.cert-block .row{border-bottom:0;cursor:pointer}
.cert-block .row.open{background:var(--hover);border-radius:6px}
.cd{
  overflow:hidden;max-height:0;opacity:0;padding:0 10px;
  transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .3s ease;
}
.cd.open{max-height:700px;opacity:1;padding:2px 10px 14px}
.cd-grid{display:flex;flex-direction:column;gap:10px}
.cd-k{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.cd-v{
  font-family:var(--mono);font-size:10.8px;line-height:1.65;color:var(--text);
  background:var(--pill);border-radius:6px;padding:7px 9px;
  white-space:pre-wrap;word-break:break-all;
}
.cd-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd-kv{display:flex;gap:8px;font-size:10.8px;font-family:var(--mono);padding:2.5px 0}
.cd-kv .kk{color:var(--dim);flex:none;min-width:118px}
.cd-kv .vv{color:var(--text);word-break:break-all}
.cd-kv .vv.ok{color:var(--emerald);font-weight:600}
@keyframes flashRow{
  0%{background:transparent}
  12%{background:#d1fae5}
  65%{background:#ecfdf5}
  100%{background:transparent}
}
.cert-block.flash .row{animation:flashRow 1.9s ease}

/* 趋势 */
.chart{position:relative;margin-top:4px}
.chart svg{display:block;width:100%;height:auto}
.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums}

/* 开关组 */
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--pill);border-radius:8px}
.seg button{font-family:inherit;font-size:11px;padding:4px 10px;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.06)}

/* ============ 筛选 chips ============ */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  font-family:inherit;font-size:11.5px;padding:4px 10px;border-radius:7px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;
}
.chip:hover{background:var(--hover)}
.chip.on{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;font-weight:600}
.chip .n{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.chip .dt{width:6px;height:6px;border-radius:2px;flex:none}

/* ============ 事件行 ============ */
.events{display:flex;flex-direction:column}
.evrow{
  display:flex;align-items:center;gap:10px;padding:7px 6px;
  border-bottom:1px solid var(--border-soft);font-size:12px;
  transition:background .15s;
}
.evrow:last-child{border-bottom:0}
.evrow:hover{background:var(--hover);border-radius:6px}
.evi{width:14px;text-align:center;font-size:11px;flex:none;font-weight:700}
.evk{font-size:10.5px;padding:1.5px 7px;border-radius:4px;flex:none;min-width:42px;text-align:center;font-weight:600}
.evd{
  flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);font-size:11px;min-width:0;
}
.evp{color:var(--dim);font-size:10.5px;flex:none;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.evt{color:var(--dim);font-size:10.5px;flex:none;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.evfoot{padding-top:10px;font-size:11px;color:var(--dim);text-align:center}
.evrow.linkable{cursor:pointer}
.evrow.linkable:hover{background:#ecfdf5;border-radius:6px}
.evgo{font-size:10px;color:var(--emerald);flex:none;opacity:0;transition:opacity .15s}
.evrow.linkable:hover .evgo{opacity:1}

/* ============ 趋势 tooltip ============ */
.tip{
  position:absolute;pointer-events:none;opacity:0;z-index:10;
  background:#1f2328;color:#fff;font-size:11px;line-height:1.55;
  padding:8px 11px;border-radius:8px;white-space:nowrap;
  transform:translate(-50%,-114%);transition:opacity .12s ease;
  box-shadow:0 4px 14px rgba(0,0,0,.2);
}
.tip.on{opacity:1}
.tip .th{font-weight:700;margin-bottom:4px;color:#a7f3d0;font-size:11px}
.tip .tv{display:flex;justify-content:space-between;gap:16px;color:#cbd5e1}
.tip .tv b{color:#fff;font-weight:600}
.guide{stroke:#10b981;stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .12s}
.guide.on{opacity:.45}

/* 侧栏 */
.kv{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12px}
.kv .k{color:var(--muted);flex:none;min-width:76px}
.kv .v{margin-left:auto;color:var(--text);font-weight:600;font-family:var(--mono);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.about{font-size:12px;line-height:1.75;color:var(--muted)}
.about b{color:var(--text);font-weight:650}
.about code{font-family:var(--mono);font-size:11px;background:var(--pill);padding:1px 4px;border-radius:3px}
.note{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--pill);font-size:11.5px;line-height:1.7;color:var(--muted)}
.note b{color:var(--text)}
.empty{padding:22px 4px;text-align:center;font-size:12px;color:var(--dim);line-height:1.7}

@media(max-width:1180px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .col-side{flex-direction:row;flex-wrap:wrap}
  .col-side .card{flex:1;min-width:280px}
}
@media(max-width:820px){
  .row2{grid-template-columns:1fr}
  .pills{gap:8px}
  .pill{flex:1;min-width:0;padding:10px 12px}
  .pill .pv{font-size:19px}
  .evp{display:none}
}

/* ---- 追加：在 DSH 里以 shadow root 挂载时的容器样式 ---- */
.hmm-root{
  
  --bg:#f7f8fa; --card:#ffffff; --border:#e8eaed; --border-soft:#f0f2f4;
  --text:#1f2328; --muted:#6e7781; --dim:#9aa4b2; --pill:#f4f5f7; --hover:#f8f9fb;
  --emerald:#10b981; --teal:#14b8a6; --blue:#3b82f6; --cyan:#06b6d4;
  --violet:#8b5cf6; --pink:#ec4899; --orange:#f97316; --amber:#f59e0b;
  --red:#ef4444; --slate:#94a3b8;
  --r:12px;
  --mono:'Cascadia Code','Consolas','SF Mono','DejaVu Sans Mono',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;

  container-type:inline-size;
  box-sizing:border-box;
  background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6;
  padding:20px 22px 64px;min-height:100%;
}
.hmm-root *{box-sizing:border-box;margin:0;padding:0}
.hmm-root .card,.hmm-root .statusbar{background:var(--card)}

/* 溯源徽标：每个卡片右上角的「源」 */
.src{
  font-family:var(--mono);font-size:10px;line-height:1.4;
  color:var(--dim);border:1px solid var(--border);border-radius:5px;
  padding:1px 6px;cursor:help;white-space:nowrap;max-width:260px;
  overflow:hidden;text-overflow:ellipsis;
}
.src:hover{color:var(--muted);border-color:#d8dde3}

/* 状态胶囊：当前相位只读展示 */
.sw.cur{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;font-weight:600;cursor:default}
.sw.idle{cursor:default;opacity:.55}

/* 空态居中 */
.empty-c{display:flex;align-items:center;justify-content:center;padding:22px 10px;text-align:center;
  font-size:12px;color:var(--dim);line-height:1.7}

/* 证书证明区：等宽数字 */
.cd-kv .vv{font-family:var(--mono);font-size:10.5px;word-break:break-all}
.cd-v{max-height:220px;overflow:auto}

/* 动作库图：深链横向滚动，节点不互相挤压 */
.hmm-root .dag{overflow-x:auto;overflow-y:hidden;padding-bottom:2px}
.hmm-root .dag-canvas{position:relative;min-width:100%}
.hmm-root .dn{width:auto;min-width:76px;max-width:104px;padding:7px 9px}
.hmm-root .dn .dt{font-size:11px}
.hmm-root .kv .v{min-width:0}

/* 证书行：守卫摘要过长时截断，不撑破卡片 */
.hmm-root .row .cg{min-width:0;max-width:52%;overflow:hidden;text-overflow:ellipsis}
.hmm-root .row .ct{min-width:40px}

/* 数据溯源清单：标签一行、路径一行，窄栏里也能读 */
.prov{padding:7px 0;border-bottom:1px solid var(--border-soft)}
.prov:last-child{border-bottom:0}
.prov-k{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.prov-v{font-family:var(--mono);font-size:10px;color:var(--text);line-height:1.5;word-break:break-all}

/* ============================================================
   排版层：把 mockup 的紧凑密度调成 dsh-context 那种呼吸感
   —— 正文 14px、卡片 20/22 内边距、块间距 16px、统计块 28px 数字。
   一律挂在 .hmm-root 下，shadow 与独立页都生效。
   ============================================================ */
.hmm-root{font-size:14px;line-height:1.6}
.hmm-root .grid{grid-template-columns:minmax(0,1fr) 360px;gap:16px}
.hmm-root .col-main,.hmm-root .col-side{gap:16px}
.hmm-root .row2{gap:16px}
.hmm-root .card{padding:20px 22px;border-radius:14px}
.hmm-root .ch{gap:9px;margin-bottom:16px}
.hmm-root .ch svg{width:16px;height:16px}
.hmm-root .ch h2{font-size:15px;font-weight:650;letter-spacing:-.1px}
.hmm-root .ch .meta{font-size:12.5px}

.hmm-root .statusbar{padding:12px 16px;gap:10px;margin-bottom:16px;border-radius:12px}
.hmm-root .sb-title{font-size:14px}
.hmm-root .sb-sub{font-size:12.5px;line-height:1.55}
.hmm-root .switcher{font-size:12px;gap:8px;margin-bottom:16px}
.hmm-root .sw{padding:4px 10px;font-size:12px;border-radius:7px}

.hmm-root .pills{gap:14px;margin-bottom:20px}
.hmm-root .pill{padding:14px 18px;min-width:118px;border-radius:12px}
.hmm-root .pill .pv{font-size:28px;line-height:1.05;letter-spacing:-.8px}
.hmm-root .pill .pl{font-size:12.5px;margin-top:5px}
/* 每块一个固定色，跟 dsh-context 的统计块一致：数字本身带色，零值也不发灰 */
.hmm-root .pill.tone-blue .pv{color:var(--blue)}
.hmm-root .pill.tone-emerald .pv{color:var(--emerald)}
.hmm-root .pill.tone-violet .pv{color:var(--violet)}
.hmm-root .pill.tone-amber .pv{color:var(--amber)}
.hmm-root .pill.tone-slate .pv{color:var(--text)}
.hmm-root .pill.dim{background:var(--pill)}
.hmm-root .pill.dim .pv{color:#9aa4b2}

.hmm-root .sect{margin-bottom:12px;gap:10px}
.hmm-root .sect h3{font-size:13.5px}
.hmm-root .sect .n{font-size:12.5px}
.hmm-root .divider{margin:20px 0}

.hmm-root .legend{gap:9px 22px}
.hmm-root .li{font-size:13px;gap:8px}
.hmm-root .li .d{width:8px;height:8px}
.hmm-root .nb{padding:10px 0;font-size:13px;gap:10px}
.hmm-root .nb .v{font-size:12.5px}

.hmm-root .rows{margin-top:2px}
.hmm-root .row{padding:12px 6px;font-size:13px;gap:12px}
.hmm-root .row .cid{font-size:12px}
.hmm-root .row .ct{font-size:12.5px}
.hmm-root .row .ck,.hmm-root .row .chv{font-size:12px}

.hmm-root .bar-row{grid-template-columns:168px 1fr 34px;gap:12px}
.hmm-root .bar-row .bn{font-size:12px}
.hmm-root .bar-row .bt{height:8px;border-radius:5px}

<script>
(function(){
'use strict';
/* 由 build-css.mjs 从 mockup/panel-v3.html 生成，勿手改。 */
const PANEL_CSS = ":root{\n  --bg:#f7f8fa; --card:#ffffff; --border:#e8eaed; --border-soft:#f0f2f4;\n  --text:#1f2328; --muted:#6e7781; --dim:#9aa4b2; --pill:#f4f5f7; --hover:#f8f9fb;\n  --emerald:#10b981; --teal:#14b8a6; --blue:#3b82f6; --cyan:#06b6d4;\n  --violet:#8b5cf6; --pink:#ec4899; --orange:#f97316; --amber:#f59e0b;\n  --red:#ef4444; --slate:#94a3b8;\n  --r:12px;\n  --mono:'Cascadia Code','Consolas','SF Mono','DejaVu Sans Mono',monospace;\n  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:13px}\nbody{padding:16px 18px 60px}\n\n/* 状态条 */\n.statusbar{\n  display:flex;align-items:center;gap:10px;background:var(--card);\n  border:1px solid var(--border);border-radius:var(--r);\n  padding:11px 14px;margin-bottom:14px;border-left:3px solid var(--slate);\n  transition:border-left-color .3s ease;\n}\n.statusbar[data-s=\"B\"]{border-left-color:var(--amber)}\n.statusbar[data-s=\"C\"]{border-left-color:var(--emerald)}\n.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--slate);flex:none;transition:background .3s}\n.statusbar[data-s=\"B\"] .sb-dot{background:var(--amber)}\n.statusbar[data-s=\"C\"] .sb-dot{background:var(--emerald);animation:pulse 1.8s infinite}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}\n.sb-title{font-size:13px;font-weight:650}\n.sb-sub{font-size:12px;color:var(--muted);flex:1}\n.sb-btn{\n  font-family:inherit;font-size:11.5px;padding:5px 11px;border-radius:7px;\n  border:1px solid var(--border);background:var(--card);color:var(--muted);\n  cursor:pointer;transition:all .15s;white-space:nowrap;\n}\n.sb-btn:hover{background:var(--hover);color:var(--text)}\n\n/* 状态切换 */\n.switcher{display:flex;gap:6px;margin-bottom:14px;align-items:center;font-size:11px;color:var(--dim)}\n.sw{\n  font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:7px;\n  border:1px solid var(--border);background:var(--card);color:var(--muted);\n  cursor:pointer;transition:all .15s;\n}\n.sw:hover{background:var(--hover)}\n.sw.on{background:#eef2ff;border-color:#c7d2fe;color:#3730a3;font-weight:600}\n\n/* 栅格 */\n.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}\n.col-main{display:flex;flex-direction:column;gap:14px;min-width:0}\n.col-side{display:flex;flex-direction:column;gap:14px;min-width:0}\n.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-width:0}\n\n/* 卡片 */\n.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;min-width:0}\n.ch{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}\n.ch svg{width:15px;height:15px;flex:none;color:var(--muted)}\n.ch h2{font-size:13px;font-weight:650;flex:1;min-width:80px}\n.ch .meta{font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}\n.ch .meta b{color:var(--muted);font-weight:600}\n\n/* 药丸 */\n.pills{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}\n.pill{background:var(--pill);border-radius:10px;padding:11px 15px;min-width:104px;transition:background .2s}\n.pill .pv{font-size:22px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}\n.pill .pl{font-size:11.5px;color:var(--muted);margin-top:3px}\n.pill.hi .pv{color:var(--emerald)}\n.pill.dim .pv{color:var(--dim)}\n.pill.warn .pv{color:var(--amber)}\n\n/* 分节 */\n.sect{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}\n.sect h3{font-size:12.5px;font-weight:600}\n.sect .n{margin-left:auto;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}\n.divider{height:1px;background:var(--border-soft);margin:16px 0}\n\n/* 图例 */\n.legend{display:flex;flex-wrap:wrap;gap:6px 18px}\n.li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}\n.li .d{width:7px;height:7px;border-radius:2px;flex:none}\n.li b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}\n\n/* 值得注意 */\n.nb{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px;border-bottom:1px solid var(--border-soft)}\n.nb:last-child{border-bottom:0}\n.nb .d{width:7px;height:7px;border-radius:2px;flex:none}\n.nb .k{color:var(--muted);flex:1}\n.nb .v{color:var(--text);font-weight:650;font-family:var(--mono);font-size:11.5px}\n.nb .v em{font-style:normal;color:var(--dim);font-weight:400}\n\n/* 条形图 */\n.bars{display:flex;flex-direction:column;gap:11px}\n.bar-row{display:grid;grid-template-columns:132px 1fr 30px;gap:10px;align-items:center}\n.bar-row .bn{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.bar-row .bt{height:7px;background:var(--pill);border-radius:4px;overflow:hidden}\n.bar-row .bf{height:100%;border-radius:4px;width:0;transition:width .6s cubic-bezier(.4,0,.2,1)}\n.bar-row .bv{font-size:11.5px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}\n.bar-row .bv.hot{color:var(--red);font-weight:600}\n\n/* 环形图 */\n.donut-wrap{display:flex;align-items:center;gap:20px}\n.donut{position:relative;flex:none}\n.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}\n.donut .ctr .big{font-size:19px;font-weight:700;letter-spacing:-.4px}\n.donut .ctr .sm{font-size:10.5px;color:var(--dim);margin-top:1px}\n.donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}\n.dl{display:flex;align-items:center;gap:7px;font-size:12px}\n.dl .d{width:7px;height:7px;border-radius:2px;flex:none}\n.dl .nm{color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.dl .pc{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}\n\n/* DAG */\n.dag{position:relative;height:196px;margin:2px 0 4px}\n.dag svg.lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}\n.dn{\n  position:absolute;transform:translate(-50%,-50%);background:var(--card);\n  border:1px solid var(--border);border-radius:9px;padding:8px 10px;width:104px;\n  box-shadow:0 1px 2px rgba(16,24,40,.04);transition:all .18s;\n}\n.dn:hover{border-color:#c7d2fe;box-shadow:0 2px 8px rgba(16,24,40,.08)}\n.dn .dk{font-size:9px;letter-spacing:.3px;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:3px}\n.dn .dt{font-size:11.5px;font-weight:650;display:block}\n.dn .do{font-size:10px;color:var(--muted);display:block;margin-top:2px}\n.dn[data-st=\"done\"] .dk{color:var(--cyan)}\n.dn[data-st=\"run\"] .dk{color:var(--amber)}\n.dn[data-st=\"hit\"]{border-color:#a7f3d0;background:#f0fdf9}\n.dn[data-st=\"hit\"] .dk{color:var(--emerald)}\n\n/* 证书行 */\n.rows{display:flex;flex-direction:column}\n.row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-soft);font-size:12px;transition:background .15s}\n.row:last-child{border-bottom:0}\n.row:hover{background:var(--hover);border-radius:6px}\n.row .ck{color:var(--emerald);flex:none;font-size:11px}\n.row .cid{font-family:var(--mono);font-size:11px;font-weight:700;flex:none;min-width:16px}\n.row .ct{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.row .cg{\n  font-size:10.5px;padding:2px 7px;border-radius:5px;flex:none;\n  background:#fffbeb;border:1px solid #fde68a;color:#92400e;\n  font-family:var(--mono);white-space:nowrap;\n}\n.row .chv{color:var(--dim);font-size:10px;flex:none;transition:transform .2s ease}\n.row.open .chv{transform:rotate(90deg)}\n\n/* ============ 证书展开 ============ */\n.cert-block{border-bottom:1px solid var(--border-soft)}\n.cert-block:last-child{border-bottom:0}\n.cert-block .row{border-bottom:0;cursor:pointer}\n.cert-block .row.open{background:var(--hover);border-radius:6px}\n.cd{\n  overflow:hidden;max-height:0;opacity:0;padding:0 10px;\n  transition:max-height .4s cubic-bezier(.4,0,.2,1),opacity .25s ease,padding .3s ease;\n}\n.cd.open{max-height:700px;opacity:1;padding:2px 10px 14px}\n.cd-grid{display:flex;flex-direction:column;gap:10px}\n.cd-k{font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--dim);margin-bottom:4px}\n.cd-v{\n  font-family:var(--mono);font-size:10.8px;line-height:1.65;color:var(--text);\n  background:var(--pill);border-radius:6px;padding:7px 9px;\n  white-space:pre-wrap;word-break:break-all;\n}\n.cd-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.cd-kv{display:flex;gap:8px;font-size:10.8px;font-family:var(--mono);padding:2.5px 0}\n.cd-kv .kk{color:var(--dim);flex:none;min-width:118px}\n.cd-kv .vv{color:var(--text);word-break:break-all}\n.cd-kv .vv.ok{color:var(--emerald);font-weight:600}\n@keyframes flashRow{\n  0%{background:transparent}\n  12%{background:#d1fae5}\n  65%{background:#ecfdf5}\n  100%{background:transparent}\n}\n.cert-block.flash .row{animation:flashRow 1.9s ease}\n\n/* 趋势 */\n.chart{position:relative;margin-top:4px}\n.chart svg{display:block;width:100%;height:auto}\n.axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:7px;font-variant-numeric:tabular-nums}\n\n/* 开关组 */\n.seg{display:inline-flex;gap:2px;padding:2px;background:var(--pill);border-radius:8px}\n.seg button{font-family:inherit;font-size:11px;padding:4px 10px;border-radius:6px;border:0;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}\n.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.06)}\n\n/* ============ 筛选 chips ============ */\n.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}\n.chip{\n  font-family:inherit;font-size:11.5px;padding:4px 10px;border-radius:7px;\n  border:1px solid var(--border);background:var(--card);color:var(--muted);\n  cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;\n}\n.chip:hover{background:var(--hov const KIND_GROUPS = [

  ['命令执行', ['pwsh', 'terminal', 'bash', 'shell', 'exec', 'run', 'npm']],

/* ------------------------------------------------------------------ 工具 */

const esc = (value) => String(value === null || value === undefined ? '' : value)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');

const num = (value) => (Number.isFinite(value) ? value : 0);

const asArray = (value) => (Array.isArray(value) ? value : []);

const obj = (value) => (value !== null && typeof value === 'object' ? value : {});

function pretty(value, limit = 2400) {
  if (value === null || value === undefined) return '—';
  let text;
  try {
    text = typeof value === 'string' ? value : JSON.stringify(value, null, 2);
  } catch (error) {
    text = String(value);
  }
  if (typeof text !== 'string') return '—';
  return text.length > limit ? `${text.slice(0, limit)}\n…（已截断，共 ${text.length} 字符，完整内容见审计日志）` : text;
}

function clockOf(at) {
  if (typeof at !== 'string' || at === '') return '—';
  const date = new Date(at);
  if (Number.isNaN(date.getTime())) return at;
  return date.toLocaleTimeString('zh-CN', { hour12: false });
}

function agoOf(at, now) {
  if (typeof at !== 'string' || at === '') return null;
  const date = new Date(at);
  if (Number.isNaN(date.getTime())) return null;
  const seconds = Math.max(0, Math.round((now - date.getTime()) / 1000));
  if (seconds < 60) return `${seconds} 秒前`;
  if (seconds < 3600) return `${Math.round(seconds / 60)} 分钟前`;
  return `${Math.round(seconds / 3600)} 小时前`;
}

function guardText(guard) {
  const value = obj(guard);
  const keys = Object.keys(value);
  if (keys.length === 0) return '—';
  return keys.map((key) => `${key}=${JSON.stringify(value[key])}`).join(' · ');
}

function kindOf(tool) {
  const name = String(tool ?? '').toLowerCase();
  for (const [kind, names] of KIND_GROUPS) {
    if (names.some((candidate) => name === candidate || name.startsWith(`${candidate}_`))) return kind;
  }
  return '其他';
}

function groupKinds(tools) {
  const map = new Map();
  for (const item of tools) {
    const kind = kindOf(item.name);
    const bucket = map.get(kind) ?? { name: kind, count: 0, tools: [] };
    bucket.count += num(item.count);
    bucket.tools.push(`${item.name} ×${item.count}`);
    map.set(kind, bucket);
  }
  return [...map.values()].sort((left, right) => right.count - left.count);
}

/* ------------------------------------------------------------------ 视图 */

/**
 * 在 host 上挂一个面板，返回 { render(snapshot), destroy() }。
 * 重复 render 同一份快照是幂等的；不同快照才会重绘。
 */
function createPanel(host, options = {}) {
  const shadow = options.shadow !== false && typeof host.attachShadow === 'function';
  // 页签切走再切回来时宿主节点可能被复用：shadow root 只能创建一次，
  // 已经有了就直接复用，否则会抛 "Shadow root cannot be created on a host
  // which already hosts a shadow tree"，面板会白掉。
  const root = shadow ? (host.shadowRoot ?? host.attachShadow({ mode: 'open' })) : host;
  root.innerHTML = `${shadow ? `<style>${PANEL_CSS}</style>` : ''}${SKELETON}`;

  const scope = root.querySelector('.hmm-root');
  const byId = (id) => (root.getElementById ? root.getElementById(id) : root.querySelector(`#${id}`));
  const el = {
    phasebar: byId('phasebar'),
    statusbar: byId('statusbar'),
    sbTitle: byId('sbTitle'),
    sbSub: byId('sbSub'),
    sbBtn: byId('sbBtn'),
    toolTotal: byId('toolTotal'),
    toolLegend: byId('toolLegend'),
    kindTotal: byId('kindTotal'),
    kindLegend: byId('kindLegend'),
    notable: byId('notable'),
    rejTotal: byId('rejTotal'),
    bars: byId('bars'),
    guardTotal: byId('guardTotal'),
    donutSegs: byId('donutSegs'),
    donutBig: byId('donutBig'),
    donutLegend: byId('donutLegend'),
    bankDepth: byId('bankDepth'),
    dag: byId('dag'),
    dagLines: byId('dagLines'),
    dagNodes: byId('dagNodes'),
    certTotal: byId('certTotal'),
    certRows: byId('certRows'),
    chart: byId('chart'),
    tip: byId('tip'),
    guide: byId('guide'),
    hoverDot: byId('hoverDot'),
    trendLine: byId('trendLine'),
    trendArea: byId('trendArea'),
    trendDots: byId('trendDots'),
    trendAxis: byId('trendAxis'),
    evTotal: byId('evTotal'),
    evChips: byId('evChips'),
    evRows: byId('evRows'),
    evFoot: byId('evFoot'),
    metaPolicy: byId('metaPolicy'),
    metaLimit: byId('metaLimit'),
    metaChain: byId('metaChain'),
    metaUptime: byId('metaUptime'),
    metaAudit: byId('metaAudit'),
    provList: byId('provList'),
  };

  const state = { filter: 'all', open: new Set(), trend: null, signature: '', data: null };

  /* ------------------------------------------------------ 静态交互绑定 */

  el.certRows.addEventListener('click', (event) => {
    const row = event.target.closest ? event.target.closest('[data-cert]') : null;
    if (row === null) return;
    const key = row.dataset.cert;
    const detail = byId(`cd-${key}`);
    if (detail === null) return;
    const open = detail.classList.toggle('open');
    row.classList.toggle('open', open);
    if (open) state.open.add(key);
    else state.open.delete(key);
  });

  el.evRows.addEventListener('click', (event) => {
    const row = event.target.closest ? event.target.closest('.evrow.linkable') : null;
    if (row === null) return;
    const key = row.dataset.cert;
    const block = byId(`cert-${key}`);
    if (block === null) return;
    const detail = byId(`cd-${key}`);
    const head = block.querySelector('.row');
    if (detail !== null && !detail.classList.contains('open')) {
      detail.classList.add('open');
      if (head !== null) head.classList.add('open');
      state.open.add(key);
    }
    block.scrollIntoView({ behavior: 'smooth', block: 'center' });
    block.classList.remove('flash');
    void block.offsetWidth;
    block.classList.add('flash');
    setTimeout(() => block.classList.remove('flash'), 2000);
  });

  el.evChips.addEventListener('click', (event) => {
    const chip = event.target.closest ? event.target.closest('[data-f]') : null;
    if (chip === null) return;
    state.filter = chip.dataset.f;
    if (state.data !== null) {
      renderChips(state.data);
      renderEvents(state.data);
    }
  });

  el.sbBtn.addEventListener('click', () => {
    const phase = PHASE[state.data?.phase] ?? PHASE.A;
    const target = byId(phase.target);
    if (target !== null) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  const hideTip = () => {
    el.tip.classList.remove('on');
    el.guide.classList.remove('on');
    el.hoverDot.setAttribute('opacity', '0');
  };

  el.chart.addEventListener('mousemove', (event) => {
    const trend = state.trend;
    if (trend === null || trend.cumulative.length === 0) return;
    const svg = el.trendLine.ownerSVGElement;
    const rect = svg.getBoundingClientRect();
    const rel = (event.clientX - rect.left) / rect.width;
    if (rel < -0.02 || rel > 1.02) { hideTip(); return; }
    const values = trend.cumulative;
    const index = Math.max(0, Math.min(values.length - 1, Math.round(rel * (values.length - 1))));
    const max = Math.max(1, ...values);
    const x = (index / (values.length - 1)) * 820;
    const y = 168 - 8 - (values[index] / max) * (168 - 16);
    el.guide.setAttribute('x1', x);
    el.guide.setAttribute('x2', x);
    el.guide.classList.add('on');
    el.hoverDot.setAttribute('cx', x);
    el.hoverDot.setAttribute('cy', y);
    el.hoverDot.setAttribute('opacity', '1');
    const step = trend.steps[index] ?? index + 1;
    el.tip.innerHTML = `<div class="th">第 ${esc(step)} 步</div>`
      + `<div class="tv"><span>本步跳过</span><b>${esc(trend.delta[index] ?? 0)} 次</b></div>`
      + `<div class="tv"><span>累计</span><b>${esc(values[index])} 次</b></div>`;
    el.tip.classList.add('on');
    const chartRect = el.chart.getBoundingClientRect();
    el.tip.style.left = `${(rect.left - chartRect.left) + (x / 820) * rect.width}px`;
    el.tip.style.top = `${(rect.top - chartRect.top) + (y / 168) * rect.height}px`;
  });
  el.chart.addEventListener('mouseleave', hideTip);

  /* ------------------------------------------------------------ 渲染 */

  function renderPhase(data) {
    const phase = data.phase === 'B' || data.phase === 'C' ? data.phase : 'A';
    const info = PHASE[phase];
    el.statusbar.dataset.s = data.offline === undefined ? phase : 'A';
    el.sbTitle.textContent = data.offline === undefined ? info.title : '读取失败';
    el.sbBtn.textContent = data.offline === undefined ? info.btn : '什么样的任务会触发？';
    if (data.offline !== undefined) {
      el.sbSub.textContent = `无法读取 /plugins/harnessmm/status：${data.offline}（宿主插件可能未启动或路由未注册）`;
    }

    const counters = obj(obj(data.status).counters);
    const banks = asArray(data.banks);
    const certs = asArray(data.certificates);
    const rate = obj(data.diagnostics).guardHitRate;
    const last = obj(data.diagnostics).lastGuardFailure;
    const parts = [];
    if (phase === 'C') {
      parts.push(`本次会话已跳过 ${num(counters.substitutions)} 次推理请求`);
      parts.push(`守卫命中率 ${rate === null || rate === undefined ? '—' : `${rate}%`}`);
      const ago = agoOf(certs.length > 0 ? certs[certs.length - 1].at : null, Date.now());
      if (ago !== null) parts.push(`最近一次 ${ago}`);
    } else if (phase === 'B') {
      const depths = asArray(obj(data.diagnostics).bankChainDepths).filter((depth) => depth > 0);
      parts.push(`已记录 ${banks.length} 个动作库${depths.length > 0 ? `（链深 ${depths.join(' / ')}）` : ''}`);
      parts.push('当前 0 次替换');
      if (last !== null) {
        const reasons = asArray(last.reasons).map((item) => item.reason).join('、');
        parts.push(`最近一次守卫未命中：${reasons === '' ? '未知原因' : reasons}`);
      } else {
        parts.push('尚未出现守卫求值');
      }
    } else {
      parts.push(`本次会话已记录 ${num(counters.requests)} 次推理请求`);
      parts.push('0 个合格动作库');
      parts.push('这不是故障：探索性任务本来就不该被复用');
    }
    if (data.offline === undefined) el.sbSub.textContent = parts.join(' · ');

    el.phasebar.innerHTML = '<span>当前状态：</span>' + ['A', 'B', 'C'].map((key) => {
      const active = key === phase;
      const title = key === 'A' ? '未激活：没有动作库' : key === 'B' ? '已授权未命中：有动作库但没有一次守卫命中' : '正在复用：守卫已命中并真实执行';
      return `<button class="sw ${active ? 'cur' : 'idle'}" type="button" title="${esc(title)}" data-phase="${key}">${key} · ${esc(PHASE[key].name)}</button>`;
    }).join('') + '<span style="margin-left:6px">由真实计数器推导</span>';
  }

  function renderPills(data) {
    const counters = obj(obj(data.status).counters);
    const depths = asArray(obj(data.diagnostics).bankChainDepths).filter((depth) => depth > 0);
    const depth = depths.length === 0 ? null : Math.round((depths.reduce((sum, item) => sum + item, 0) / depths.length) * 10) / 10;
    const rate = obj(data.diagnostics).guardHitRate;
    const rows = [
      ['v1', 'p1', 'blue', num(counters.substitutions), false],
      ['v2', 'p2', 'emerald', num(counters.certificates), false],
      ['v3', 'p3', 'violet', asArray(data.banks).length, false],
      ['v4', 'p4', 'slate', depth === null ? '—' : depth, depth === null],
      ['v5', 'p5', 'amber', rate === null || rate === undefined ? '—' : `${rate}%`, rate === null || rate === undefined],
    ];
    for (const [valueId, pillId, tone, value, dim] of rows) {
      const valueEl = byId(valueId);
      const pillEl = byId(pillId);
      if (valueEl === null || pillEl === null) continue;
      valueEl.textContent = String(value);
      pillEl.className = dim ? 'pill dim' : `pill tone-${tone}`;
    }
  }

  function renderLegend(target, total, items, emptyText) {
    const totalEl = byId(total);
    if (totalEl !== null) totalEl.textContent = String(items.reduce((sum, item) => sum + item.count, 0));
    target.innerHTML = items.length === 0
      ? `<span class="li" style="color:var(--dim)">${esc(emptyText)}</span>`
      : items.map((item, index) => `<span class="li"${item.tools ? ` title="${esc(item.tools.join('、'))}"` : ''}><span class="d" style="background:${PALETTE[index % PALETTE.length]}"></span>${esc(item.name)} <b>${esc(item.count)}</b></span>`).join('');
  }

  function renderNotable(data) {
    const items = asArray(obj(data.diagnostics).notable);
    el.notable.innerHTML = items.length === 0
      ? '<div class="empty" style="padding:10px">暂无异常</div>'
      : items.map((item) => `<div class="nb"><span class="d" style="background:${TONE_COLOR[item.tone] ?? 'var(--slate)'}"></span><span class="k">${esc(item.key)}</span><span class="v">${esc(item.value)}${item.note ? ` <em>${esc(item.note)}</em>` : ''}</span></div>`).join('');
  }

  function renderBars(data) {
    const rejection = asArray(obj(data.diagnostics).rejection).filter((item) => num(item.count) > 0)
      .sort((left, right) => right.count - left.count);
    const total = asArray(obj(data.provenance).rejection ? [obj(data.provenance).rejection] : [])
      .map((item) => num(item.total))[0] ?? rejection.reduce((sum, item) => sum + num(item.count), 0);
    el.rejTotal.textContent = String(total);
    if (rejection.length === 0) {
      el.bars.innerHTML = '<div class="empty-c">还没有守卫拒绝记录<br>守卫全部通过时这里保持为空</div>';
      return;
    }
    const max = Math.max(1, ...rejection.map((item) => num(item.count)));
    el.bars.innerHTML = rejection.map((item) => {
      const value = num(item.count);
      const pct = (value / max) * 100;
      const color = REASON_COLOR[item.reason] ?? 'var(--slate)';
      return `<div class="bar-row"><span class="bn" title="${esc(item.reason)}">${esc(item.reason)}</span>`
        + `<div class="bt"><div class="bf" style="width:${pct.toFixed(1)}%;background:${color}"></div></div>`
        + `<span class="bv${value ? ' hot' : ''}">${value}</span></div>`;
    }).join('');
  }

  function renderDonut(data) {
    const fields = asArray(obj(data.distributions).guardFields);
    const total = fields.reduce((sum, item) => sum + num(item.count), 0);
    el.guardTotal.textContent = String(total);
    el.donutBig.textContent = String(total);
    const radius = 52;
    const circumference = 2 * Math.PI * radius;
    let offset = 0;
    let segments = '';
    let legend = '';
    for (const item of fields) {
      const value = num(item.count);
      const share = total === 0 ? 0 : value / total;
      const length = share * circumference;
      const color = GUARD_COLOR[item.field] ?? 'var(--slate)';
      if (length > 0) {
        segments += `<circle cx="66" cy="66" r="${radius}" fill="none" stroke="${color}" stroke-width="15"`
          + ` stroke-dasharray="${length} ${circumference - length}" stroke-dashoffset="${-offset}"`
          + ' transform="rotate(-90 66 66)" style="transition:all .5s ease"/>';
      }
      offset += length;
      legend += `<div class="dl"><span class="d" style="background:${color}"></span>`
        + `<span class="nm">${esc(item.field)}</span><span class="pc">${total === 0 ? 0 : Math.round(share * 100)}%</span></div>`;
    }
    el.donutSegs.innerHTML = segments;
    el.donutLegend.innerHTML = legend;
  }

  function renderDag(data) {
    const banks = asArray(data.banks);
    const withCandidates = banks.filter((bank) => asArray(bank.candidates).length > 0);
    const bank = withCandidates.slice().sort((left, right) => num(right.chainDepth) - num(left.chainDepth))[0];
    el.bankDepth.textContent = bank === undefined ? '—' : String(num(bank.chainDepth));
    if (bank === undefined) {
      el.dagNodes.innerHTML = '<div class="empty-c" style="position:absolute;inset:0">尚未记录动作库<br>模型写出合格 CHISEL_PLAN 后出现</div>';
      el.dagLines.innerHTML = '';
      return;
    }

    const candidates = asArray(bank.candidates).slice(0, 8);
    const byId2 = new Map();
    const nodes = [{ id: 'root', label: 'root', tool: bank.root?.name ?? 'root', after: null, status: 'done' }];
    for (const candidate of candidates) {
      nodes.push({
        id: String(candidate.id ?? '?'),
        label: `候选 ${candidate.id ?? '?'}`,
        tool: String(candidate.tool ?? ''),
        after: candidate.after === null || candidate.after === undefined ? 'root' : String(candidate.after),
        status: num(obj(data.status).counters.substitutions) > 0 ? 'hit' : 'run',
      });
    }
    for (const node of nodes) byId2.set(node.id, node);

    const depthOf = new Map([['root', 0]]);
    for (let pass = 0; pass < nodes.length; pass += 1) {
      for (const node of nodes) {
        if (node.id === 'root') continue;
        const parent = depthOf.get(node.after);
        if (parent === undefined) continue;
        depthOf.set(node.id, Math.max(depthOf.get(node.id) ?? 0, parent + 1));
      }
    }
    const maxDepth = Math.max(1, ...depthOf.values());
    const rows = new Map();
    for (const node of nodes) {
      const depth = depthOf.get(node.id) ?? 0;
      const bucket = rows.get(depth) ?? [];
      bucket.push(node);
      rows.set(depth, bucket);
    }
    // 按层排布：一列一层；宽度够就撑满，不够就横向滚动，节点不互相挤压。
    const available = el.dag.clientWidth || 440;
    const spacing = Math.max(80, Math.min(118, (available - 96) / Math.max(1, maxDepth)));
    const canvasWidth = Math.max(available, 62 + maxDepth * spacing + 62);
    const canvasHeight = 196;
    const placed = [];
    for (const [depth, bucket] of [...rows.entries()].sort((left, right) => left[0] - right[0])) {
      bucket.forEach((node, index) => {
        const x = 62 + depth * spacing;
        const y = bucket.length === 1 ? 98 : 34 + (index / (bucket.length - 1)) * 128;
        placed.push({ ...node, x, y });
      });
    }
    const placedById = new Map(placed.map((node) => [node.id, node]));
    const hit = num(obj(data.status).counters.substitutions) > 0;

    const edges = placed.filter((node) => node.id !== 'root').map((node) => {
      const from = placedById.get(node.after) ?? placedById.get('root');
      if (from === undefined) return '';
      const mid = (from.x + node.x) / 2;
      return `<path d="M ${from.x} ${from.y} C ${mid} ${from.y}, ${mid} ${node.y}, ${node.x} ${node.y}" fill="none" stroke="${hit ? 'rgba(16,185,129,.45)' : 'rgba(148,163,184,.4)'}" stroke-width="1"/>`;
    }).join('');

    el.dagLines.innerHTML = '';
    el.dagNodes.innerHTML = `<div class="dag-canvas" style="width:${canvasWidth}px;height:${canvasHeight}px">`
      + `<svg class="lines" viewBox="0 0 ${canvasWidth} ${canvasHeight}" preserveAspectRatio="none">${edges}</svg>`
      + placed.map((node) => `<div class="dn" data-st="${node.status}" style="left:${node.x}px;top:${node.y}px">`
        + `<span class="dk">${esc(node.label)}</span><span class="dt">${esc(node.tool)}</span>`
        + `<span class="do">${esc(node.id === 'root' ? '已执行' : `after ${node.after}`)}</span></div>`).join('')
      + '</div>';
  }

  function renderCerts(data) {
    const certificates = asArray(data.certificates).slice().reverse();
    el.certTotal.textContent = String(certificates.length);
    if (certificates.length === 0) {
      el.certRows.innerHTML = '<div class="empty-c">暂无证书<br>证书只在守卫命中且动作真实执行后才签发</div>';
      return;
    }
    el.certRows.innerHTML = certificates.map((certificate, index) => {
      const key = `${certificate.candidateId ?? '?'}-${certificates.length - index}`;
      const open = state.open.has(key);
      const proof = [
        ['native_receipt_sha256', certificate.receiptSha256 ?? '—'],
        ['bank_sha256', certificate.bankSha256 ?? '—'],
        ['call_id', certificate.callId ?? '—'],
        ['steps', `${num(certificate.stepsBefore)} → ${num(certificate.stepsAfter)}`],
        ['valid_substitution', certificate.validSubstitution ? 'true' : 'false'],
        ['is_error', certificate.isError ? 'true' : 'false'],
        ['at', certificate.at ?? '—'],
        ['session', certificate.session ?? '—'],
      ].map(([label, value]) => `<div class="cd-kv"><span class="kk">${esc(label)}</span><span class="vv${label === 'valid_substitution' && certificate.validSubstitution ? ' ok' : ''}">${esc(value)}</span></div>`).join('');
      return `<div class="cert-block" id="cert-${esc(key)}">
        <div class="row${open ? ' open' : ''}" data-cert="${esc(key)}">
          <span class="ck">✓</span>
          <span class="cid">${esc(certificate.candidateId ?? '?')}</span>
          <span class="ct">${esc(certificate.tool ?? '—')}</span>
          <span class="cg">${esc(guardText(certificate.guard))}</span>
          <span class="chv">›</span>
        </div>
        <div class="cd${open ? ' open' : ''}" id="cd-${esc(key)}">
          <div class="cd-grid">
            <div>
              <div class="cd-k">exact_arguments</div>
              <div class="cd-v">${esc(pretty(certificate.arguments))}</div>
            </div>
            <div class="cd-2">
              <div>
                <div class="cd-k">guard</div>
                <div class="cd-v">${esc(pretty(certificate.guard))}</div>
              </div>
              <div>
                <div class="cd-k">guard_fields（求值结果）</div>
                <div class="cd-v">${esc(pretty(certificate.guardFields))}</div>
              </div>
            </div>
            <div>
              <div class="cd-k">native_receipt（真实回执）</div>
              <div class="cd-v">${esc(pretty(certificate.receipt))}</div>
            </div>
            <div>
              <div class="cd-k">证明</div>
              ${proof}
            </div>
          </div>
        </div>
      </div>`;
    }).join('');
  }

  function renderTrend(data) {
    const trend = obj(data.trend);
    const values = asArray(trend.cumulative);
    state.trend = { steps: asArray(trend.steps), cumulative: values, delta: asArray(trend.delta) };
    hideTip();
    if (values.length === 0) {
      el.chart.classList.add('is-empty');
      el.trendLine.setAttribute('d', '');
      el.trendArea.setAttribute('d', '');
      el.trendDots.innerHTML = '';
      el.trendAxis.innerHTML = '<span style="color:var(--dim)">还没有替换发生，趋势为空</span>';
      return;
    }
    el.chart.classList.remove('is-empty');
    const max = Math.max(1, ...values);
    const stepX = values.length === 1 ? 0 : 820 / (values.length - 1);
    const points = values.map((value, index) => [index * stepX, 168 - 8 - (value / max) * (168 - 16)]);
    const line = points.map(([x, y], index) => `${index === 0 ? 'M' : 'L'} ${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');
    el.trendLine.setAttribute('d', line);
    el.trendArea.setAttribute('d', `${line} L 820 168 L 0 168 Z`);
    el.trendDots.innerHTML = points.map(([x, y], index) => (values[index] === 0 ? ''
      : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#fff" stroke="#10b981" stroke-width="1.6"/>`)).join('');
    const steps = asArray(trend.steps);
    const picks = [0, Math.floor((steps.length - 1) / 3), Math.floor(((steps.length - 1) * 2) / 3), steps.length - 1];
    el.trendAxis.innerHTML = picks.map((index) => `<span>第 ${esc(steps[index] ?? index + 1)} 步</span>`).join('');
  }

  function renderChips(data) {
    const counts = obj(obj(data.events).counts);
    const total = num(obj(data.events).total);
    const defs = [
      ['all', '全部', null, total],
      ['author', '授权', EV_KIND.author.dot, num(counts.author)],
      ['admit', '准入', EV_KIND.admit.dot, num(counts.admit)],
      ['substitute', '替换', EV_KIND.substitute.dot, num(counts.substitute)],
      ['reject', '拒绝', EV_KIND.reject.dot, num(counts.reject)],
      ['defer', '延迟', EV_KIND.defer.dot, num(counts.defer)],
    ];
    el.evChips.innerHTML = defs.map(([key, label, dot, count]) => `<button class="chip${state.filter === key ? ' on' : ''}" type="button" data-f="${key}">`
      + `${dot ? `<span class="dt" style="background:${dot}"></span>` : ''}${esc(label)}<span class="n">${esc(count)}</span></button>`).join('');
  }

  /** 一条 gdr 事件 → 一行人话 + 关联证书 key。 */
  function describeEvent(event) {
    const raw = obj(event.raw);
    const kind = event.class ?? '';
    if (kind === 'substitute') {
      const candidate = raw.candidate_id ?? '?';
      const tool = raw.exact_native_tool ?? '—';
      const guard = guardText(raw.guard);
      return {
        text: `候选 ${candidate} · ${tool}${guard === '—' ? '' : ` · ${guard}`}`,
        cert: `${candidate}-`,
      };
    }
    if (kind === 'admit') {
      const rejected = asArray(raw.rejected);
      if (rejected.length === 0) {
        const eligible = num(raw.eligible_count) || asArray(raw.eligible).length;
        return { text: `root 回执 · ${eligible} 候选合格`, cert: null };
      }
      const reasons = rejected.map((item) => item.reason).filter((item) => typeof item === 'string');
      return { text: `${reasons.join('、') || '未命中'} · ${rejected.length} 候选不合格`, cert: null };
    }
    if (kind === 'author') {
      const depth = num(raw.chain_depth) || num(raw.depth);
      const candidates = asArray(raw.candidates).length || num(raw.candidate_count);
      return { text: `动作库 · 链深 ${depth || '—'} · ${candidates || '—'} 候选${raw.reason ? ` · ${raw.reason}` : ''}`, cert: null };
    }
    if (kind === 'reject') {
      return { text: raw.reason ? `未认证执行 · ${raw.reason}` : '未认证执行', cert: null };
    }
    if (kind === 'defer') {
      return { text: raw.reason ? `歧义延迟 · ${raw.reason}` : '歧义延迟 · 交还模型', cert: null };
    }
    return { text: String(raw.kind ?? '未知事件'), cert: null };
  }

  function renderEvents(data) {
    const events = asArray(obj(data.events).recent);
    const total = num(obj(data.events).total);
    el.evTotal.textContent = String(total);
    const filtered = state.filter === 'all' ? events : events.filter((event) => event.class === state.filter);
    const rows = filtered.slice(-200).reverse();
    if (rows.length === 0) {
      el.evRows.innerHTML = '<div class="empty-c">暂无事件<br>模型第一次进入决策点后开始记录</div>';
      el.evFoot.textContent = '';
      return;
    }
    // 证书 key 前缀匹配：替换事件用 candidate_id 关联到最新一条同候选证书
    const certKeys = asArray(data.certificates).slice().reverse()
      .map((certificate, index) => `${certificate.candidateId ?? '?'}-${asArray(data.certificates).length - index}`);
    el.evRows.innerHTML = rows.map((event) => {
      const kind = EV_KIND[event.class] ?? { label: '事件', fg: 'var(--muted)', bg: 'var(--pill)', bd: 'var(--border)', dot: 'var(--slate)', icon: '·' };
      const described = describeEvent(event);
      let certKey = null;
      if (described.cert !== null) {
        certKey = certKeys.find((key) => key.startsWith(described.cert)) ?? null;
      }
      const session = event.session === null || event.session === undefined ? '—' : String(event.session);
      const position = session.length > 6 ? `…${session.slice(-6)}` : session;
      return `<div class="evrow${certKey === null ? '' : ' linkable'}"${certKey === null ? '' : ` data-cert="${esc(certKey)}"`}>`
        + `<span class="evi" style="color:${kind.dot}">${kind.icon}</span>`
        + `<span class="evk" style="color:${kind.fg};background:${kind.bg};border:1px solid ${kind.bd}">${esc(kind.label)}</span>`
        + `<span class="evd">${esc(described.text)}</span>`
        + `<span class="evp">${esc(position)}</span>`
        + `<span class="evt">${esc(clockOf(event.at))}</span>`
        + `${certKey === null ? '' : '<span class="evgo">跳转 ›</span>'}</div>`;
    }).join('');

    el.evFoot.textContent = rows.length < total
      ? `显示最近 ${rows.length} 条 / 共 ${total} 条 · 完整记录见审计日志`
      : `共 ${total} 条 · 完整记录见审计日志`;
  }

  function renderMeta(data) {
    const status = obj(data.status);
    const policy = obj(status.policy);
    const audit = obj(obj(data.provenance).audit);
    el.metaPolicy.textContent = policy.version === undefined ? '—' : `policy v${policy.version}`;
    el.metaLimit.textContent = `${num(policy.maximum_candidates) || '—'} 候选 · ${num(policy.maximum_fast_steps) || '—'} 步`;
    el.metaChain.textContent = String(num(status.minimumChain));
    const uptime = num(status.uptimeSeconds);
    el.metaUptime.textContent = uptime < 60 ? `${uptime} 秒` : uptime < 3600 ? `${Math.round(uptime / 60)} 分钟` : `${Math.round(uptime / 3600)} 小时`;
    const path = typeof audit.path === 'string' ? audit.path : '';
    el.metaAudit.textContent = path === '' ? '—' : path.split(/[\\/]/).pop();
    el.metaAudit.setAttribute('title', path);
  }

  function renderProvenance(data) {
    if (el.provList === null) return;
    const prov = obj(data.provenance);
    const counters = obj(prov.counters);
    const admissions = obj(prov.admissions);
    const rejection = obj(prov.rejection);
    const trend = obj(prov.trend);
    const audit = obj(prov.audit);
    const rows = [
      ['跳过推理 / 证书', counters.source, counters.note],
      ['替换证书', obj(prov.certificates).source, null],
      ['当前动作库', obj(prov.banks).source, null],
      ['为什么没命中', rejection.source, null],
      ['趋势', trend.source, null],
      ['事件', admissions.source === undefined ? null : `${admissions.source}（${num(admissions.count)}/${num(admissions.capacity)}）`, null],
      ['审计日志', typeof audit.path === 'string' ? audit.path : null, null],
    ].filter(([, value]) => typeof value === 'string' && value !== '');
    el.provList.innerHTML = rows.map(([label, value, note]) => '<div class="prov">'
      + `<div class="prov-k">${esc(label)}</div>`
      + `<div class="prov-v" title="${esc(note === null ? value : `${value} · ${note}`)}">${esc(value)}</div>`
      + '</div>').join('');
  }

  function render(data) {
    state.data = data;
    renderPhase(data);
    renderPills(data);
    renderLegend(el.toolLegend, 'toolTotal', asArray(obj(data.distributions).tools), '尚无替换发生');
    renderLegend(el.kindLegend, 'kindTotal', groupKinds(asArray(obj(data.distributions).tools)), '尚无替换发生');
    renderNotable(data);
    renderBars(data);
    renderDonut(data);
    renderDag(data);
    renderCerts(data);
    renderTrend(data);
    renderChips(data);
    renderEvents(data);
    renderMeta(data);
    renderProvenance(data);
    return scope;
  }

  return {
    element: scope,
    render,
    destroy() {
      if (shadow) host.shadowRoot?.replaceChildren();
      else host.innerHTML = '';
    },
  };
}

/**
 * 轮询 /plugins/harnessmm/status，把每份新快照交给面板。
 * 同一份快照（文本完全一致）不会触发重绘，避免打断展开/悬停状态。
 */
function pollStatus(panel, options = {}) {
  const url = options.url ?? '/plugins/harnessmm/status';
  const interval = options.interval ?? 2000;
  let signature = '';
  let stopped = false;
  let timer = null;

  const tick = async () => {
    try {
      const response = await fetch(url, {
        cache: 'no-store',
        credentials: 'same-origin',
        headers: { accept: 'application/json' },
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();
      if (stopped) return;
      if (text !== signature) {
        signature = text;
        panel.render(JSON.parse(text));
      }
    } catch (error) {
      if (stopped) return;
      const message = String(error?.message ?? error);
      if (`offline:${message}` !== signature) {
        signature = `offline:${message}`;
        panel.render(offline(message));
      }
    }
    if (!stopped) timer = setTimeout(tick, interval);
  };

  tick();
  return () => {
    stopped = true;
    if (timer !== null) clearTimeout(timer);
  };
}

/** 读不到快照时的降级快照：界面结构不变，数字全部清零并说明原因。 */
function offline(reason) {
  return {
    schema: 'harnessmm-panel/offline',
    phase: 'A',
    offline: reason,
    provenance: { audit: { path: null } },
    status: { counters: {}, policy: {}, minimumChain: 0, uptimeSeconds: 0, sessions: 0, pendingActions: 0 },
    diagnostics: { rejection: [], notable: [], bankChainDepths: [], guardHitRate: null, lastGuardFailure: null },
    banks: [],
    certificates: [],
    distributions: { tools: [], sessions: [], guardFields: [] },
    trend: { steps: [], cumulative: [], delta: [] },
    events: { total: 0, counts: {}, recent: [] },
  };
}



var host = document.getElementById('root');
var panel = createPanel(host, { shadow: false });
window.__hmm = { panel: panel, createPanel: createPanel, host: host };
pollStatus(panel);
})();
</script>
